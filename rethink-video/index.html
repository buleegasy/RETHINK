<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RETHINK Exact LoginWall Animation</title>
    <style>
      :root {
        --surface-dim: #ecebe7;
        --on-surface: #1a1c1a;
        --on-surface-variant: #514536;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--surface-dim);
        color: var(--on-surface);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .wall {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--surface-dim);
        color: var(--on-surface);
      }

      .hero {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-38px);
        pointer-events: none;
      }

      .title {
        margin: 0 0 24px;
        padding: 0 16px;
        text-align: center;
        font-family: "Times New Roman", Times, serif;
        font-size: 196px;
        line-height: 1;
        font-weight: 300;
        letter-spacing: 0.2em;
        color: var(--on-surface);
        filter: blur(20px);
        opacity: 0;
        transform: translateY(10px);
        text-shadow: 0 4px 24px rgba(255, 255, 255, 0.4);
        filter-origin: center;
      }

      .decrypt {
        position: relative;
        display: inline-block;
        line-height: 1;
      }

      .decrypt .preserve {
        visibility: hidden;
        user-select: none;
        pointer-events: none;
        display: block;
        white-space: pre;
      }

      .decrypt .overlay {
        position: absolute;
        inset: 0;
        display: block;
        white-space: pre;
      }

      .author {
        margin: 0 0 64px;
        padding: 0 24px;
        text-align: center;
        font-size: 28px;
        line-height: 1.625;
        font-weight: 300;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(81, 69, 54, 0.8);
        opacity: 0;
      }

      .blur-root {
        display: inline;
        opacity: 0;
      }

      .word {
        display: inline-block;
        white-space: nowrap;
      }

      .char {
        display: inline-block;
        will-change: transform, opacity, filter;
        opacity: 0;
        filter: blur(12px);
        transform: translateY(12px);
      }

      @media (min-width: 768px) {
        .title {
          font-size: 196px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wall">
      <div class="hero" id="hero">
        <h1 class="title" id="title">
          <span class="decrypt" aria-label="RETHINK">
            <span class="preserve" aria-hidden="true">RETHINK</span>
            <span class="overlay" id="decryptText">RETHINK</span>
          </span>
        </h1>

        <p class="author" id="author">
          <span class="blur-root" id="blurRoot" aria-label="作者：陈浩然"></span>
        </p>
      </div>
    </div>

    <script>
      const FPS = 60;
      const DURATION = 6;
      const TITLE = "RETHINK";
      const AUTHOR = "作者：陈浩然";
      const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+{}|:\"<>?-=[]\\;',./";
      const titleEl = document.getElementById("title");
      const decryptTextEl = document.getElementById("decryptText");
      const authorEl = document.getElementById("author");
      const blurRootEl = document.getElementById("blurRoot");

      function cubicBezierY(t, p1y, p2y) {
        const u = 1 - t;
        return 3 * u * u * t * p1y + 3 * u * t * t * p2y + t * t * t;
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function easeOut(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function exactEase(t) {
        return cubicBezierY(t, 1, 1);
      }

      function blurEase(t) {
        return cubicBezierY(t, 1, 1);
      }

      function seeded(seed) {
        const x = Math.sin(seed * 12.9898) * 43758.5453;
        return x - Math.floor(x);
      }

      function glyphAt(position, frame) {
        return GLYPHS[Math.floor(seeded(position * 131 + frame * 17) * GLYPHS.length)];
      }

      function decryptAt(t) {
        const delay = 0.3;
        const speed = 0.03;
        const scrambleSteps = 3;
        if (t < delay) return "";

        const frame = Math.floor((t - delay) / speed);
        const totalFrames = TITLE.length * scrambleSteps;
        if (frame > totalFrames) return TITLE;

        let currentText = "";
        const resolvedIndex = Math.floor(frame / scrambleSteps);
        for (let i = 0; i < TITLE.length; i++) {
          if (i < resolvedIndex) {
            currentText += TITLE[i];
          } else if (i === resolvedIndex) {
            currentText += glyphAt(i, frame);
          } else {
            currentText += glyphAt(i + 19, frame);
          }
        }
        return currentText;
      }

      function buildBlurText() {
        blurRootEl.innerHTML = "";
        const words = AUTHOR.split(" ");
        words.forEach((word, wordIdx) => {
          const wordSpan = document.createElement("span");
          wordSpan.className = "word";
          Array.from(word).forEach((char) => {
            const charSpan = document.createElement("span");
            charSpan.className = "char";
            charSpan.textContent = char;
            wordSpan.appendChild(charSpan);
          });
          blurRootEl.appendChild(wordSpan);
          if (wordIdx < words.length - 1) {
            const space = document.createElement("span");
            space.style.display = "inline-block";
            space.setAttribute("aria-hidden", "true");
            space.innerHTML = "&nbsp;";
            blurRootEl.appendChild(space);
          }
        });
      }

      buildBlurText();
      const chars = Array.from(document.querySelectorAll(".char"));

      function setAtTime(t) {
        const titleProgress = exactEase(clamp((t - 0.2) / 2, 0, 1));
        titleEl.style.opacity = titleProgress.toFixed(4);
        titleEl.style.transform = `translateY(${(10 * (1 - titleProgress)).toFixed(3)}px)`;
        titleEl.style.filter = `blur(${(20 * (1 - titleProgress)).toFixed(3)}px)`;
        decryptTextEl.textContent = decryptAt(t);

        const pProgress = easeOut(clamp((t - 1.5) / 2, 0, 1));
        authorEl.style.opacity = pProgress.toFixed(4);

        const rootProgress = clamp((t - 1.5) / 0.01, 0, 1);
        blurRootEl.style.opacity = rootProgress.toFixed(4);

        chars.forEach((char, i) => {
          const itemProgress = blurEase(clamp((t - (1.5 + i * 0.03)) / 0.8, 0, 1));
          char.style.opacity = itemProgress.toFixed(4);
          char.style.filter = `blur(${(12 * (1 - itemProgress)).toFixed(3)}px)`;
          char.style.transform = `translateY(${(12 * (1 - itemProgress)).toFixed(3)}px)`;
        });
      }

      window.__RETHINK_ANIMATION__ = { setAtTime, duration: DURATION, fps: FPS };
      setAtTime(0);

      if (!new URLSearchParams(location.search).has("render")) {
        const start = performance.now();
        function loop(now) {
          setAtTime(((now - start) / 1000) % DURATION);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
